<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Olatee administrator login."
    >

    <meta name="theme-color" content="#f8e7eb">

    <title>Admin Login — Olatee</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="admin-login">

        <div class="admin-login-card">

            <a href="index.html" class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 64 64">
                        <path d="M44 14c-7 1-12 6-14 12-2 7 1 14 7 18-5 3-12 3-18 0-6-3-9-9-8-15 1-7 7-12 14-13 6-1 12 1 16 5 2-3 2-5 3-7z"/>
                        <path d="M39 13c5-5 11-5 15-2-2 5-7 8-13 7"/>
                        <path d="M28 44c-2 7-7 11-13 13"/>
                    </svg>
                </span>

                <span class="brand-name">olatee</span>
            </a>

            <h1>Administrator Login</h1>

            <p>Sign in to manage your store.</p>

            <form id="admin-login-form">

                <label for="admin-email">
                    Email
                </label>

                <input
                    type="email"
                    id="admin-email"
                    placeholder="Admin email"
                    required
                >

                <label for="admin-password">
                    Password
                </label>

                <input
                    type="password"
                    id="admin-password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Sign In
                </button>

                <p id="admin-login-message"></p>

            </form>

        </div>

    </main>

    <script src="app.js"></script>

</body>
                          </html>
